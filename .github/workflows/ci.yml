name: CI

on:
  push:
    branches: [master, qa, dev]
  pull_request:
    branches: [master, qa, dev]
  # Lets the CD workflow reuse this pipeline as a gate: the deployment only
  # starts when this verification job has succeeded.
  workflow_call:

jobs:
  verify:
    name: Lint, build, unit tests and acceptance tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and architecture boundaries
        run: pnpm lint

      - name: Type check and build
        run: pnpm build

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Pull the images used by the acceptance tests
        run: |
          docker pull postgres:17-alpine
          docker pull testcontainers/ryuk:0.14.0

      - name: Acceptance tests
        run: pnpm test:bdd
